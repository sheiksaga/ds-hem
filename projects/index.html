<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- support browser themeing -->
    <meta name="theme-color" content="#002f80">
    <meta name="msapplication-navbutton-color" content="#002f80">
    <meta name="apple-mobile-web-app-status-bar-style" content="#002f80">
    <!-- title -->
    <title>Design Saga - Projects | Things I've Built</title>
    <!-- meta description for SEO -->
    <meta name="description" content="Projects by Sangeeth Gandhi - MES Windows launcher, ChatChat LLM UI, and more.">
    <!-- Open Graph tags for social sharing -->
    <meta property="og:title" content="Design Saga - Projects">
    <meta property="og:description" content="Things I've built — MES, ChatChat, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://designsaga.com/projects">
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
    <!-- custom styles -->
    <!-- Load fonts directly -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@700&family=Syne&display=swap" rel="stylesheet">

    <!-- Initialize theme immediately to prevent FOUC -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- Load CSS files directly instead of via @import -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/projects.css">
    <!-- quicklinks -->
    <script src="https://unpkg.com/quicklink@2.3.0/dist/quicklink.umd.js" defer></script>
    <script>
      // Only initialize Quicklink if NOT on file:// protocol
      if (window.location.protocol !== 'file:') {
        window.addEventListener('load', function() {
          try {
            if (typeof quicklink !== 'undefined') {
              quicklink.listen();
              console.log('Quicklink initialized');
            }
          } catch (error) {
            console.warn('Quicklink failed to initialize:', error);
          }
        });
      } else {
        console.log('Quicklink disabled (file:// protocol detected)');
      }
    </script>
</head>

<body>
    <!-- skip navigation link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- scroll progress indicator -->
    <div class="scroll-progress"></div>
    <!-- header -->
    <header class="ds-header" id="header">
            <a href="../index.html">

                    <li class="list-item"><a href="../blog/index.html">BLOG</a></li>
            </ul>
            <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark mode">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="star star-1">★</span>
                <span class="star star-2">★</span>
            </button>
        </div>
    </header>

    <!-- intro -->

        <div >
            Built in GBG with lots of Love <br>
            Sangeeth G, 2026 <br> <br><br>
        </div>
    </footer>

    <!-- js scripts -->
    <script src="../assets/js/styles.js"></script>

</body>
</html>
